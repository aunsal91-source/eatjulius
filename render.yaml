services:
  - type: web
    name: eatjulius
    runtime: python
    region: frankfurt
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eatjulius-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: KITCHEN_PIN
        sync: false

databases:
  - name: eatjulius-db
    region: frankfurt
    plan: basic-256mb
